name: Prose

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  vale:
    name: Vale (Google style)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5
        with:
          install_args: vale aqua:reviewdog/reviewdog

      - name: Fetch Vale styles
        run: vale sync

      - name: Vale -> reviewdog annotations
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # OpenSpec specs remain in Vale; generated Claude templates are excluded.
          # Annotations avoid GitHub's PR review body limit and review POST failures.
          vale . --glob '!{CHANGELOG.md,.claude/**}' --output=line 2>/dev/null | reviewdog \
            -efm="%f:%l:%c:%m" \
            -name="vale" \
            -reporter=github-annotations \
            -filter-mode=added \
            -level=warning \
            -fail-level=none

  markdownlint:
    name: Markdownlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5
        with:
          install_args: node npm:markdownlint-cli2

      - name: Run markdownlint
        run: markdownlint-cli2 "**/*.md"
