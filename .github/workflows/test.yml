name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test, Lint, and Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up tools with mise
        uses: jdx/mise-action@v2
        with:
          install_args: go@1.27.1 golangci-lint@2.14.0 go:golang.org/x/vuln/cmd/govulncheck@1.8.0

      - name: Run golangci-lint
        run: golangci-lint run

      - name: Run vulnerability check
        run: govulncheck ./...
        continue-on-error: true

      - name: Run tests
        run: go test -v ./...
