[tools]

# ---------------------------------------------------------------- build & test

# Keep in sync with the `go` directive in go.mod.
go = "1.27.2"

# Matches finfocus and finfocus-plugin-aws-public for consistency.
golangci-lint = "2.15.0"

# Vulnerability scanner for Go dependencies.
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"

# Release binary building.
goreleaser = "2.18.3"

# ------------------------------------------------------------------ docs & lint

# Node provides npm backend for markdownlint and commitlint.
node = "24"

# Markdown linting CLI.
"npm:markdownlint-cli2" = "0.23.3"

# Lints GitHub workflow YAML files.
actionlint = "1.7.12"

# Prose linting for documentation.
vale = "3.24.0"

# Commitlint dependencies are locked in package-lock.json; install with npm ci.

# Code review automation via aqua registry.
"aqua:reviewdog/reviewdog" = "0.21.2"

[tasks.test]
description = "Run all tests"
run = "make test"

[tasks.lint]
description = "Run linters"
run = "make lint"

[tasks.lint-md]
description = "Lint markdown files"
run = "make lint-md"

[tasks.vuln]
description = "Check for security vulnerabilities"
run = "make vuln"

[tasks.fmt]
description = "Format code"
run = "make fmt"

[tasks.build]
description = "Build plugin binary"
run = "make build"

[tasks.release-check]
description = "Check goreleaser configuration"
run = "make release-check"

[tasks.e2e]
description = "Run FinFocus core against the local plugin and fake AWS"
run = "make e2e"

[tasks.conformance]
description = "Run the official plugin SDK conformance suite"
run = "make conformance"
