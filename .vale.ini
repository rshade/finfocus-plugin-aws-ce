StylesPath = .vale/styles

# Fetched by `vale sync` and gitignored: style packages are pinned dependencies.
# Only the vocabulary is tracked.
Packages = Google

Vocab = FinFocus

[*.md]
BasedOnStyles = Vale, Google
# Include specifications and implementation plans in Markdown prose checks.
Vale.Spelling = YES
Google.Passive = YES
Google.Acronyms = YES
Google.Contractions = YES
Google.EmDash = YES
Google.Exclamation = YES
Google.Headings = YES
Google.Hyphens = YES
Google.Periods = YES
Google.Quotes = YES
Google.Ranges = YES
Google.Semicolons = YES
Google.Slang = YES
Google.WordChoice = YES

# Release Please generates CHANGELOG.md. Keep it out of Vale and reviewdog.
[CHANGELOG.md]
BasedOnStyles =
